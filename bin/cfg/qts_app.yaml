# qts_cli defaults: bare `./qts_cli` (from bin/) reads this file
# (<exe-dir>/cfg/qts_app.yaml). Connection plus account/strategy
# presets; explicit argv/commands always win. No secrets here: the login
# password comes from $QTS_GW_PW (or a tty hidden prompt), never this file.
gateway:
  # Local Unix socket (default): matches cfg/qts.yaml gateway.socket.
  socket: /tmp/qts-gateway.sock
  # TCP alternative for remote servers (exactly one of socket/tcp):
  # tcp: 127.0.0.1:19001
# Default presets filling omitted command keys (account doubles as the
# default login account; operator= stays a login alias).
account: 10014939
strategy: grid-600185
instrument: 600185
# Quick-trade presets (quick strategy|buy|sell use these as prompted defaults):
# quantity/lower/upper/grids are asked per ticket unless passed as k=v.
# Prices are 定点 integers (1/10000 yuan): 4.20 yuan = 42000.
# stock = allocated settled shares funded at dynamic start (sellable from
# the first tick); stock_avg = their cost (0 = unknown).
quick:
   quantity: 100
   lower: 42000
   upper: 46000
   grids: 8
   stock: 800
   stock_avg: 44200
