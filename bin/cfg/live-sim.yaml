# QTS live-sim: strategy auto-fire against the SIMULATION counter over the
# production vendor path (QuantAPI V2.7.1.2). Quotes come from a file
# (closed-market friendly); every intent routes to the real sim gateway
# (routing lists quantapi only, so the Router always picks it). The paper
# channel stays for the strategy book only and never receives orders.
# Simulation env only: demo IPs/accounts, survives only in vendor builds.
# Secrets come from QTS_QUANTAPI_* env, never this file.
environment: paper
config_version: "1"
rules_version: "1"
ledger_file: ../db/live-sim-ledger.jsonl
sqlite_file: ../db/live-sim.db
state_file: ../db/live-sim-state.json
accounts:
  - id: paper-book
    broker: simulated
    security_account_id: A123456789
  - id: live
    broker: quantapi
    # Test-env shareholder account (SSE; discovered from the demo login).
    # Passwords stay in QTS_QUANTAPI_* env, never here.
    security_account_id: A461951056
risk:
  max_order_quantity: 200
  max_order_notional: 100000000
  trading_enabled: true
  enforce_sellable: true
strategies:
  - id: sim-grid
    type: grid
    enabled: true
    account: live
    instrument: 600000.SSE
    lower: 88000
    upper: 106000
    grids: 4
    quantity: 100
    start: 97000
execution:
  algo: immediate
routing:
  weights: {fee: 1, latency: 1, fill: 1}
  channels:
    - channel: quantapi
      fee_bps: 25
      fill_rate_bps: 10000
      latency_us: 500
quantapi:
  locations: "172.16.109.17:32001"
  order_way: "4"
log:
  file: ../log/qts-live-sim.log
  level: info
demo:
  enabled: true
  ticks: 12
  interval_ms: 500
  seed: 7
  feed: file
  file: live-sim-quotes.csv
trading_day:
  rollover: "00:01"
instruments:
  - id: 600000.SSE
    exchange: sse
    board: main
    tick: 100
    min_qty: 100
    lot_step: 100
    limit_down: 87300
    limit_up: 106700
paper_sim:
  starting_cash: 10000000
  starting_positions:
    - instrument: 600000.SSE
      quantity: 1600
      avg_cost: 97000
      strategy: sim-grid
    - instrument: 600000.SSE
      quantity: 500
      avg_cost: 97000
      strategy: trader-grid
control:
  inbox: ../db/live-sim-inbox.jsonl
