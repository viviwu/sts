# QTS strict A-share business demo: master + T+1 + fees + opening inventory
# all ON (demo.yaml keeps them opt-in for backward compat).
# Path: simulated walk -> grid -> risk -> OMS -> simulated matching,
# with JSONL ledger + log file + SQLite projection. Not for live trading.
environment: paper
config_version: "1"
rules_version: "1"
# Recovery authority: JSONL event stream, appended across restarts.
# Relative paths resolve against this file's directory (bin/cfg).
ledger_file: ../db/ashare-ledger.jsonl
# Query projection: async SQLite read model (qts_admin db --sqlite ...).
sqlite_file: ../db/ashare.db
# Live-state snapshot for qts_admin state (zero IPC).
state_file: ../db/ashare-state.json
accounts:
  - id: paper
    broker: simulated
    # A-share identity: required now that instruments below is non-empty.
    security_account_id: A123456789
risk:
  max_order_quantity: 1000
  max_order_notional: 10000000
  trading_enabled: true
  # Strict T+1: sells must come from settled inventory (funded below).
  enforce_sellable: true
  # Buying power: buys must fit inside synced cash minus live buy exposure.
  enforce_cash: true
strategies:
  - id: grid-1
    type: grid
    enabled: true
    account: paper
    instrument: TEST
    lower: 900
    upper: 1100
    grids: 4
    quantity: 100
    start: 1000
# Execution algorithm shared by all parents (immediate|twap|pov|vwap|iceberg).
execution:
  algo: immediate
# Structured-log file sink: stdout stays, a copy goes to a per-day,
# per-startup unique file derived from this pattern.
log:
  file: ../log/qts-ashare.log
  level: info
# Continuous demo feed: deterministic walk (seed-pinned).
demo:
  enabled: true
  ticks: 200
  interval_ms: 0
  seed: 42
  # Standing depth for M6 book simulation (reference-price fills when 0).
  depth_levels: 5
  depth_quantity: 50
  depth_tick: 1
  auction_ticks: 0
  halt_after: 0
  halt_for: 0
  stale_every: 0
  crossed_every: 0
  feed: simulated
# Trading-day boundary (local HH:MM).
trading_day:
  rollover: "00:01"
# Instrument master: non-empty pins the allowlist (unknown symbols fail
# closed) and drives tick/lot/band/identity checks in risk.
instruments:
  - id: TEST
    exchange: sse
    board: main
    tick: 1
    min_qty: 100
    lot_step: 100
    max_qty: 1000000
    sell_odd_lot_only: true
    market_orders_allowed: true
    limit_down: 800
    limit_up: 1200
# Paper fidelity: opening inventory is settled (immediately sellable, cash
# untouched); fees come from the dedicated table (default schedule applies
# to TEST, 600000.SSE override ships as the VIP-seat example).
paper_sim:
  starting_cash: 10000000
  starting_positions:
    - instrument: TEST
      quantity: 10000
      avg_cost: 1000
      strategy: grid-1
  fee_file: fees-ashare.yaml
# Disk retention (same defaults as paper.example.yaml).
retention:
  log_files: 20
  ledger_rotate_mb: 64
# Operator inbox (M11-4, optional, empty = disabled).
# control:
#   inbox: ../db/ashare-control-inbox.jsonl
